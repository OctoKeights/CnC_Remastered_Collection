[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/OctoKeights/CnC_Remastered_Collection"

[workspace.dependencies]
cnc-core = { path = "crates/cnc-core" }
cnc-td = { path = "crates/cnc-td" }
cnc-ra = { path = "crates/cnc-ra" }
cnc-sim = { path = "crates/cnc-sim" }
bevy_ecs = { version = "0.20", default-features = false, features = ["std", "multi_threaded"] }
bevy_tasks = { version = "0.20", default-features = false, features = ["multi_threaded"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The original engine is built on deliberate fixed-width integer arithmetic;
# these casts are reviewed individually rather than linted wholesale.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
